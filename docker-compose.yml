version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: pipeline-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlruns:/app/mlruns
    environment:
      - DATABASE_URL=sqlite:///./pipeline_monitor.db
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - LOG_LEVEL=INFO
    depends_on:
      - mlflow
    networks:
      - pipeline-net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: pipeline-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - pipeline-net
    restart: unless-stopped

  mlflow:
    image: python:3.11-slim
    container_name: pipeline-mlflow
    command: >
      bash -c "pip install mlflow==2.9.2 && mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow/artifacts"
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/artifacts
      - mlflow-db:/mlflow
    networks:
      - pipeline-net
    restart: unless-stopped

networks:
  pipeline-net:
    driver: bridge

volumes:
  mlflow-db:
