name: CI Pipeline - Leak Detection Platform

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Generate synthetic data
        run: python -m backend.training.synthetic_pipeline_leak_generator

      - name: Verify data generated
        run: |
          ls -la data/
          python -c "import pandas as pd; df=pd.read_csv('data/pipeline_sensor_data.csv'); print(f'Rows: {len(df)}, Cols: {len(df.columns)}'); assert len(df) >= 200000, 'Not enough rows'"

      - name: Train ML models
        run: python -m backend.training.train_pipeline

      - name: Verify models created
        run: |
          ls -la models/
          python -c "import joblib; m=joblib.load('models/leak_classifier.joblib'); print('Classifier loaded OK')"

      - name: Start backend and health check
        run: |
          python run_backend.py &
          sleep 8
          curl -f http://localhost:8000/health
          curl -f http://localhost:8000/dashboard/summary
          curl -f http://localhost:8000/docs

      - name: Test prediction endpoint
        run: |
          curl -f -X POST http://localhost:8000/predict/leak \
            -H "Content-Type: application/json" \
            -d '{"pipeline_id":"PL-001","pressure_anomaly_score":0.7,"acoustic_anomaly_score":0.5,"structural_risk_index":0.3,"flow_imbalance_score":0.4,"changepoint_score":0.2}'

      - name: Test pipeline detail endpoint
        run: curl -f http://localhost:8000/pipeline/PL-001

      - name: Test alerts endpoint
        run: curl -f http://localhost:8000/alerts

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify build output
        run: |
          ls -la frontend/dist/
          test -f frontend/dist/index.html

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Generate data for Docker build
        run: |
          pip install pandas numpy
          python -m backend.training.synthetic_pipeline_leak_generator

      - name: Build Docker images
        run: docker compose build

      - name: Start services
        run: |
          docker compose up -d
          sleep 15

      - name: Health check via Docker
        run: |
          curl -f http://localhost:8000/health
          curl -f http://localhost:3000

      - name: Stop services
        run: docker compose down
